<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="nibMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d3835" />
      <stop offset="40%" stop-color="#2a2725" />
      <stop offset="70%" stop-color="#4a4440" />
      <stop offset="100%" stop-color="#1e1c1b" />
    </linearGradient>
    <linearGradient id="brassBand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c49a45" />
      <stop offset="100%" stop-color="#8a6721" />
    </linearGradient>
  </defs>
  <!-- Pen Nib Body -->
  <path d="M1 1 L8 16 C9 18 11.5 20.5 14.5 21.5 L21.5 14.5 C20.5 11.5 18 9 16 8 L1 1 Z" fill="url(#nibMetal)" stroke="#12100e" stroke-width="1" stroke-linejoin="round"/>
