  <path d="M8 5 L14 10" stroke="#8a8078" stroke-width="0.7" fill="none"/>
  <!-- Breather Hole -->
  <circle cx="11" cy="11" r="1.5" fill="#12100e"/>
  <!-- Center Slit to Tip -->
  <line x1="1" y1="1" x2="10" y2="10" stroke="#12100e" stroke-width="0.9"/>
  <!-- Wet India Ink on Nib Tip -->
  <path d="M1 1 L4 7 C3 6 2 4 1 1 Z" fill="#050505"/>
  <circle cx="1.5" cy="1.5" r="1.3" fill="#000000"/>
